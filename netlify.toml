# Preparation for a possible future Netlify deploy — see ZERO_COST_HOSTING.md
# for why (Vercel Hobby's ToS restricts commercial use; Netlify Free does
# not). NOT YET TESTED against a real Netlify deployment — this is a
# reasonable starting config, not a verified-working one. Confirm the
# Next.js Runtime plugin actually builds this project (Payload's admin
# panel and API routes need Node.js server functions, not a static export)
# before relying on it.

[build]
  command = "npx payload migrate && npm run seed && next build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables (DATABASE_URI, PAYLOAD_SECRET, NEXT_PUBLIC_SITE_URL,
# CRON_SECRET, BLOB_READ_WRITE_TOKEN or a Netlify equivalent for backups,
# etc.) are set in the Netlify UI (Site settings → Environment variables),
# not here — see .env.example for the full list and PROJECT_HANDOFF.md.
